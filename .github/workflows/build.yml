name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > app/taxipay.p12
      - name: Build signed APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk taxi-pay.apk
          gh release create "v${{ github.run_number }}" taxi-pay.apk --title "Taxi Pay v${{ github.run_number }}" --notes "Download taxi-pay.apk and install it." --latest --repo "${{ github.repository }}"
