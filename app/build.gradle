plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
  namespace 'com.taxipay.app'
  compileSdk 34
  defaultConfig { applicationId 'com.taxipay.app'; minSdk 24; targetSdk 34; versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1'); versionName '1.5'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
  signingConfigs {
    release {
      storeFile file('taxipay.p12'); storePassword System.getenv('KS_PASS'); keyAlias 'taxipay'; keyPassword System.getenv('KS_PASS'); storeType 'pkcs12'
    }
  }
  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
  lint { checkReleaseBuilds false; abortOnError false }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}
dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1' }
